name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: imed_finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/imed_finance_test
      BOT_TOKEN: "123:test"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        run: |
          psql "$DATABASE_URL" -f app/db/migrations/001_init.sql
          psql "$DATABASE_URL" -f app/db/migrations/002_audit_triggers.sql
          psql "$DATABASE_URL" -f app/db/migrations/003_seed.sql
        env:
          PGPASSWORD: postgres

      - name: Compile check
        run: python -m py_compile app/*.py app/handlers/*.py

      - name: Run tests
        run: pytest -v
