services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: imed
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: imed_finance
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migratsiyalar birinchi ishga tushganda alifbo tartibida bajariladi
      - ./app/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    depends_on:
      - db
    restart: unless-stopped

  # Web App dashboard uchun HTTPS reverse-proxy — IXTIYORIY.
  # WEBAPP_URL bo'sh bo'lsa Caddy noto'g'ri manzil bilan ishga tusholmaydi,
  # shuning uchun bu servis "webapp" profilisiz ishga tushmaydi:
  #   oddiy holat:        docker compose up -d
  #   dashboard bilan:    docker compose --profile webapp up -d
  # (WEBAPP_URL avval .env'da to'ldirilgan bo'lishi shart.)
  caddy:
    image: caddy:2-alpine
    profiles: ["webapp"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      WEBAPP_URL: ${WEBAPP_URL:-}
    depends_on:
      - bot
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
