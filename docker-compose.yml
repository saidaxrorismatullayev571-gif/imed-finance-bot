services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: imed
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: imed_finance
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migratsiyalar birinchi ishga tushganda alifbo tartibida bajariladi
      - ./app/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    depends_on:
      - db
    restart: unless-stopped

  # Telegram Web App dashboard (FastAPI). WEBAPP_URL bu xizmatga ishora qilsin (HTTPS).
  webapp:
    build: .
    env_file: .env
    command: ["uvicorn", "webapp.main:app", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      - db
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Kunlik backup (pg_dump). Nusxalar ./backups ga gzip qilib saqlanadi.
  backup:
    image: postgres:16-alpine
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    restart: unless-stopped

volumes:
  pgdata:
